# Cross-compilation settings for Android targets.
#
# The NDK's *.cmd wrapper scripts mangle linker arguments on this host
# ("unexpected occurrence of --version-script"), so clang.exe is invoked
# directly with an explicit --target and --sysroot instead.

[target.aarch64-linux-android]
linker = "E:/anton/Hermes/_tools/android-ndk-r27c/toolchains/llvm/prebuilt/windows-x86_64/bin/clang.exe"
rustflags = [
    "-C", "link-arg=--target=aarch64-linux-android21",
    "-C", "link-arg=--sysroot=E:/anton/Hermes/_tools/android-ndk-r27c/toolchains/llvm/prebuilt/windows-x86_64/sysroot",
]

[target.armv7-linux-androideabi]
linker = "E:/anton/Hermes/_tools/android-ndk-r27c/toolchains/llvm/prebuilt/windows-x86_64/bin/clang.exe"
rustflags = [
    "-C", "link-arg=--target=armv7a-linux-androideabi21",
    "-C", "link-arg=--sysroot=E:/anton/Hermes/_tools/android-ndk-r27c/toolchains/llvm/prebuilt/windows-x86_64/sysroot",
]

[target.x86_64-linux-android]
linker = "E:/anton/Hermes/_tools/android-ndk-r27c/toolchains/llvm/prebuilt/windows-x86_64/bin/clang.exe"
rustflags = [
    "-C", "link-arg=--target=x86_64-linux-android21",
    "-C", "link-arg=--sysroot=E:/anton/Hermes/_tools/android-ndk-r27c/toolchains/llvm/prebuilt/windows-x86_64/sysroot",
]
